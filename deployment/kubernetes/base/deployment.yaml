apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-router
  labels:
    app.kubernetes.io/name: context-router
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: context-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: context-router
    spec:
      containers:
        - name: context-router
          image: context-router:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
